<script>
const c=document.querySelector('#game'),ctx=c.getContext('2d');const mini=document.querySelector('#miniMapCanvas'),mctx=mini.getContext('2d');let W,H,dpr=1;function resize(){W=c.clientWidth;H=c.clientHeight;dpr=Math.min(devicePixelRatio||1,2);c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();

let player={x:0,y:0,dir:0,vx:0,vy:0,step:0,moving:0,running:false,seated:false};const benches=[{x:-98,y:-10,rot:0},{x:99,y:10,rot:Math.PI},{x:10,y:-99,rot:Math.PI/2},{x:-10,y:99,rot:-Math.PI/2}];const trafficRoutes=[{points:[[-820,-415],[615,-415],[615,-390],[615,390],[550,415],[-350,415],[-415,390],[-415,-390],[-350,-415]],closed:true},{points:[[820,-365],[-350,-365],[-365,-390],[-365,390],[-350,365],[550,365],[565,390],[565,-390],[550,-365]],closed:true},{points:[[-1000,-20],[-205,-20]],closed:false},{points:[[-205,20],[-1000,20]],closed:false},{points:[[205,-20],[1000,-20]],closed:false},{points:[[1000,20],[205,20]],closed:false}];for(const route of trafficRoutes){route.lengths=[];route.total=0;const segments=route.closed?route.points.length:route.points.length-1;for(let i=0;i<segments;i++){const a=route.points[i],b=route.points[(i+1)%route.points.length],len=Math.hypot(b[0]-a[0],b[1]-a[1]);route.lengths.push(len);route.total+=len}}const carColors=['#e16d54','#5688bb','#e1b64f','#538d70','#aa78a8','#e5e1d6','#40535c','#cb8d58'];const cars=trafficRoutes.flatMap((route,r)=>Array.from({length:route.closed?8:4},(_,i)=>({route,r,distance:((i+.15*r)/(route.closed?8:4))*route.total,speed:40+(i*7+r*5)%19,baseSpeed:40+(i*7+r*5)%19,color:carColors[(i+r*3)%carColors.length],type:(i+r)%5,angle:0,x:0,y:0})));const trafficLights=[{x:-390,y:0,offset:0},{x:590,y:0,offset:6}];const people=[{x:-132,y:-20,name:'paní Růžena',color:'#d66f55',hair:'#43342e',msg:'Zdravím! Dneska je na trhu čerstvé ovoce.'},{x:143,y:63,name:'Matěj',color:'#577bca',hair:'#332d29',msg:'Ahoj! Zrovna jdu nakrmit kachny.'},{x:51,y:-161,name:'Eliška',color:'#dfb84e',hair:'#724a34',msg:'Tohle náměstí mám nejradši.'},{x:-233,y:116,name:'pošťák',color:'#588c73',hair:'#3a312a',msg:'Zásilky doručeny, přeju pěkný den!'},{x:247,y:-73,name:'Adam',color:'#aa78a8',hair:'#39302c',msg:'Nevíš, kde tu mají dobrou zmrzlinu?'},{x:-70,y:188,name:'Tereza',color:'#e48da2',hair:'#60452f',msg:'Ahoj, užíváš si procházku?'}];let el const solidBuildings=[[-340,-264,160,92],[205,-264,160,92],[-340,172,160,92],[205,172,160,92],[-560,-44,145,92],[410,-44,145,92],[-700,-650,116,78],[-170,-650,116,78],[150,-650,116,78],[680,-650,116,78],[-700,540,116,78],[-170,540,116,78],[150,540,116,78],[680,540,116,78],[-700,-180,116,78],[690,-180,116,78],[-700,175,116,78],[690,175,116,78]];

function drawCar(car){ctx.save();ctx.translate(car.x,car.y);ctx.rotate(car.angle);const size=car.type===3?1.24:car.type===4?1.12:1;ctx.scale(size,size);ctx.fillStyle='#20302c45';ctx.beginPath();ctx.ellipse(1,6,27,14,0,0,7);ctx.fill();/* tires and metallic body */ctx.fillStyle='#293332';for(const wx of [-14,10]){rounded(wx,-12,9,5,2,'#293332');rounded(wx,7,9,5,2,'#293332');ctx.fillStyle='#96a19a';ctx.beginPath();ctx.arc(wx+4,-9.5,1.4,0,7);ctx.arc(wx+4,9.5,1.4,0,7);ctx.fill();ctx.fillStyle='#293332'}rounded(-23,-10,46,20,6,'#273735');rounded(-22,-9,44,18,5,car.color);rounded(15,-7,6,14,2,shade(car.color,1.1));rounded(-21,-7,4,14,2,shade(car.color,.78));ctx.strokeStyle='#ffffff90';ctx.lineWidth=.8;ctx.beginPath();ctx.moveTo(10,-7);ctx.lineTo(15,-5);ctx.moveTo(10,7);ctx.lineTo(15,5);ctx.moveTo(-17,0);ctx.lineTo(-12,0);ctx.stroke();/* windshield, panoramic roof and rear glass */ctx.fillStyle='#a9d8d8';ctx.beginPath();ctx.moveTo(7,-7);ctx.lineTo(15,-6);ctx.lineTo(18,-3);ctx.lineTo(18,3);ctx.lineTo(15,6);ctx.lineTo(7,7);ctx.closePath();ctx.fill();rounded(-7,-7,12,14,3,'#527779');rounded(-5,-6,8,12,2,'#bfe5e2');ctx.fillStyle='#bce5e1';ctx.beginPath();ctx.moveTo(-17,-6);ctx.lineTo(-10,-7);ctx.lineTo(-10,7);ctx.lineTo(-17,6);ctx.closePath();ctx.fill();ctx.strokeStyle='#ffffff75';ctx.lineWidth=.8;ctx.beginPath();ctx.moveTo(2,-8);ctx.lineTo(2,8);ctx.moveTo(-9,-8);ctx.lineTo(-9,8);ctx.stroke();rounded(2,-12,5,3,1,'#425052');rounded(2,9,5,3,1,'#425052');/* lamps and indicators */rounded(20,-7,3,5,1,'#fff4cd');rounded(20,2,3,5,1,'#fff4cd');rounded(-22,-7,2,5,1,'#d35e53');rounded(-22,2,2,5,1,'#d35e53');if(car.turning&&Math.floor(performance.now()/320)%2===0){rounded(18,-9,4,4,1,'#ffd45c');rounded(18,5,4,4,1,'#ffd45c')}if(car.type===1){rounded(-1,-2,6,4,2,'#f0ca59');ctx.fillStyle='#fff4d1';ctx.fillRect(-2,-2,1,4)}if(car.type===2){ctx.fillStyle='#e8f0e9';ctx.font='bold 5px "DM Mono"';ctx.textAlign='center';ctx.fillText('TAXI',0,2)}if(car.type===3){rounded(-17,-8,30,16,3,shade(car.col function signalState(light,axis,time){const p=(time/1000+light.offset)%14;if(axis==='h')return p<6?'green':p<7?'yellow':p<13?'red':'yellow';return p<6?'red':p<7?'yellow':p<13?'green':'yellow'}
function drawTrafficLights(){const time=performance.now();for(const light of trafficLights){ctx.save();const x=light.x+31,y=light.y+25;ctx.fillStyle='#00000022';ctx.beginPath();ctx.ellipse(x+3,y+3,8,4,0,0,7);ctx.fill();ctx.strokeStyle='#52605a';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y-31);ctx.stroke();rounded(x-6,y-48,12,20,3,'#293633');for(const [i,col,axis] of [[0,'#ef6658','h'],[1,'#f0c652','h'],[2,'#70ce83','v']]){const state=signalState(light,axis,time);ctx.fillStyle=state==='red'&&i===0?'#ff564d':state==='yellow'&&i===1?'#ffd34f':state==='green'&&i===2?'#6ce58a':col+'55';ctx.beginPath();ctx.arc(x,y-44+i*7,2.3,0,7);ctx.fill()}ctx.restore()}}

function updateCars(dt){const now=performance.now();for(const car of cars){const route=car.route,total=route.total;let left=car.distance,seg=0;while(left>route.lengths[seg]&&seg<route.lengths.length-1){left-=route.lengths[seg];seg++}let a=route.points[seg],b=route.points[(seg+1)%route.points.length],f=left/route.lengths[seg];car.x=a[0]+(b[0]-a[0])*f;car.y=a[1]+(b[1]-a[1])*f;car.angle=Math.atan2(b[1]-a[1],b[0]-a[0]);const next=(seg+1)%route.points.length,after=route.points[(next+1)%route.points.length],nextAngle=Math.atan2(after[1]-b[1],after[0]-b[0]),turn=Math.atan2(Math.sin(nextAngle-car.angle),Math.cos(nextAngle-car.angle));car.turning=Math.abs(turn)>.2&&route.lengths[seg]-left<85;let gap=total;for(const other of cars){if(other===car||other.r!==car.r)continue;const ahead=(other.distance-car.distance+total)%total;if(ahead>0.1&&ahead<gap)gap=ahead}let target=gap<75?Math.min(car.baseSpeed,Math.max(0,(gap-28)*1.15)):car.baseSpeed;const axis=Math.abs(Math.sin(car.angle))>.7?'v':'h';for(const light of trafficLights){if(Math.abs(car.x-light.x)<76&&Math.abs(car.y-light.y)<78&&signalState(light,axis,now)!=='green')target=0}if(Math.hypot(car.x-player.x,car.y-player.y)<46||people.some(p=>Math.hypot(car.x-p.x,car.y-p.y)<46))target=0;car.speed+=(target-car.speed)*Math.min(1,dt*2.8);car.distance=(car.distance+car.speed*dt)%total}}

function updatePeople(dt){for(const p of people){p.pause=Math.max(0,(p.pause||0)-dt);if(p.tx&&Math.hypot(p.tx-p.x,p.ty-p.y)<14){p.tx=null;p.ty=null;p.pause=.7+Math.random()*1.2}if(p.pause>0){p.moving=false;continue}if(!p.tx){for(let tries=0;tries<20;tries++){const angle=Math.random()*Math.PI*2,dist=60+Math.random()*150,tx=Math.max(-730,Math.min(730,p.x+Math.cos(angle)*dist)),ty=Math.max(-700,Math.min(700,p.y+Math.sin(angle)*dist));if(!hitsBuilding(tx,ty)){p.tx=tx;p.ty=ty;break}}if(!p.tx){p.pause=.5;continue}}const dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy);if(d<=5){p.moving=false;continue}const step=Math.min(d,32*dt),sx=dx/d*step,sy=dy/d*step;let moved=false;if(!hitsBuilding(p.x+sx,p.y)&&!hitsTrafficVehicle(p.x+sx,p.y)){p.x+=sx;moved=true}if(!hitsBuilding(p.x,p.y+sy)&&!hitsTrafficVehicle(p.x,p.y+sy)){p.y+=sy;moved=true}if(!moved&&hitsTrafficVehicle(p.x+sx,p.y+sy)){let closest=null,best=Infinity;for(const car of cars){const q=Math.hypot(car.x-p.x,car.y-p.y);if(q<best){best=q;closest=car}}if(closest){const q=Math.hypot(closest.x-p.x,closest.y-p.y)||1,px=(p.x-closest.x)/q,py=(p.y-closest.y)/q;for(const side of [1,-1]){const ax=p.x-py*step*side,ay=p.y+px*step*side;if(!hitsBuilding(ax,ay)&&!hitsTrafficVehicle(ax,ay)){p.x=ax;p.y=ay;moved=true;break}}}}p.moving=moved;if(moved){p.dir=Math.atan2(dy,dx);p.walk=(p.walk||0)+dt*8}else if(hitsBuilding(p.x+sx,p.y+sy)){p.tx=null;p.ty=null;p.pause=.25}}}
function drawPerson(x,y,shirt,hair,isPlayer,name,state={}){const phase=isPlayer?player.step:(state.walk||0),moving=isPlayer?player.moving:(state.moving?0.7:0),facing=isPlayer?player.dir:(state.dir||0),swing=moving?Math.sin(phase)*2.2:0,bob=moving?Math.sin(phase*2)*.8:0;ctx.save();ctx.fillStyle='#18262035';ctx.beginPath();ctx.ellipse(x,y+9,10+moving*2,5.5,0,0,7);ctx.fill();if(isPlayer&&player.seated){rounded(x-7,y-1,14,10,5,shirt);ctx.strokeStyle='#303431';ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x-5,y+7);ctx.lineTo(x-7,y+11);ctx.lineTo(x-2,y+11);ctx.moveTo(x+5,y+7);ctx.lineTo(x+7,y+11);ctx.lineTo(x+2,y+11);ctx.stroke();ctx.fillStyle='#34302d';ctx.beginPath();ctx.ellipse(x,y-7,6.5,7,0,0,7);ctx.fill();ctx.fillStyle=hair;ctx.beginPath();ctx.ellipse(x,y-9,5.3,4.8,0,0,7);ctx.fill()}else{ctx.strokeStyle='#d9a886';ctx.lineWidth=3.5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x-6,y+bob);ctx.lineTo(x-9,y+4+swing+bob);ctx.moveTo(x+6,y+bob);ctx.lineTo(x+9,y+4-swing+bob);ctx.stroke();ctx.fillStyle='#e5b392';ctx.beginPath();ctx.arc(x-9,y+4+swing+bob,2,0,7);ctx.arc(x+9,y+4-swing+bob,2,0,7);ctx.fill();const shirtGrad=ctx.createLinearGradient(x-7,y,x+7,y);shirtGrad.addColorStop(0,shade(shirt,.76));shirtGrad.addColorStop(.48,shirt);shirtGrad.addColorStop(1,shade(shirt,.82));rounded(x-6,y-3+bob,12,15,5,shirtGrad);ctx.fillStyle='#ffffff45';ctx.beginPath();ctx.ellipse(x-2,y+1+bob,2,5,0,0,7);ctx.fill();ctx.fillStyle='#e8b990';ctx.beginPath();ctx.ellipse(x,y-7+bob,6.6,7,0,0,7);ctx.fill();ctx.fillStyle=hair;ctx.beginPath();ctx.ellipse(x,y-9+bob,5.5,4.8,0,0,7);ctx.fill();ctx.fillStyle='#353332';ctx.beginPath();ctx.roundRect(x-4,y+10+swing+bob,3.5,5,1);ctx.roundRect(x+.5,y+10-swing+bob,3.5,5,1);ctx.fill()}/* Tiny faces turn with each person: two eyes and a curved smile. */ctx.save();ctx.translate(x,y-7+bob);ctx.rotate(facing);ctx.fillStyle='#fff8e9';ctx.beginPath();ctx.ellipse(2.7,-2,1.2,1.45,0,0,7);ctx.ellipse(2.7,2,1.2,1.45,0,0,7);ctx.fill();ctx.fillStyle='#46352f function drawMinimap(){const w=mini.width,h=mini.height,sx=w/2000,sy=h/1800,X=x=>(x+1000)*sx,Y=y=>(y+900)*sy;mctx.clearRect(0,0,w,h);mctx.fillStyle='#c8d6b8';mctx.fillRect(0,0,w,h);mctx.fillStyle='#dfc990';mctx.fillRect(X(820),0,(970-820)*sx,h);mctx.fillStyle='#73bdc1';mctx.fillRect(X(948),0,w-X(948),h);mctx.fillStyle='#d8d5c8';for(const [x,y,ww,hh] of [[-1000,-90,1820,180],[-90,-900,180,1800],[-1000,-455,1820,130],[-1000,325,1820,130],[-455,-900,130,1800],[325,-900,130,1800],[525,-900,130,1800]])mctx.fillRect(X(x),Y(y),ww*sx,hh*sy);mctx.fillStyle='#f1eee3';for(const [x,y,ww,hh] of [[-1000,-77,1820,154],[-77,-900,154,1800],[-1000,-444,1820,108],[-1000,336,1820,108],[-444,-900,108,1800],[336,-900,108,1800],[536,-900,108,1800]])mctx.fillRect(X(x),Y(y),ww*sx,hh*sy);mctx.fillStyle='#e7e2d2';mctx.fillRect(X(-202),Y(-202),404*sx,404*sy);mctx.fillStyle='#a88f75';for(const [bx,by,bw,bh] of solidBuildings)mctx.fillRect(X(bx),Y(by-34),bw*sx,(bh+34)*sy);for(const p of people){mctx.fillStyle=p.color;mctx.beginPath();mctx.arc(X(p.x),Y(p.y),2.5,0,Math.PI*2);mctx.fill()}for(const car of cars){mctx.fillStyle='#b95e48';mctx.fillRect(X(car.x)-1,Y(car.y)-1,2,2)}mctx.fillStyle='#25332d';mctx.beginPath();mctx.arc(X(player.x),Y(player.y),5,0,Math.PI*2);mctx.fill();mctx.strokeStyle='#fff';mctx.lineWidth=1.5;mctx.beginPath();mctx.arc(X(player.x),Y(player.y),6.5,0,Math.PI*2);mctx.stroke()}
let last=0;function loop(t){let dt=Math.min((t-last)/1000,.04);last=t;updatePeople(dt);updateCars(dt);let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),n=Math.hypot(dx,dy);if(n){dx/=n;dy/=n}if(n&&player.seated)player.seated=false;player.running=!!(keys.shift&&n);const max=player.running?180:105,accel=player.running?760:620,friction=900;if(n){player.vx+=dx*accel*dt;player.vy+=dy*accel*dt;player.dir=Math.atan2(dy,dx)}else{const v=Math.hypot(player.vx,player.vy);if(v){const nv=Math.max(0,v-friction*dt),ratio=nv/v;player.vx*=ratio;player.vy*=ratio}}const speed=Math.hypot(player.vx,player.vy);if(speed>max){player.vx=player.vx/speed*max;player.vy=player.vy/speed*max}const nx=player.x+player.vx*dt,ny=player.y+player.vy*dt;if(!hitsBuilding(nx,player.y)&&!hitsTrafficVehicle(nx,player.y)&&nx<940)player.x=nx;else player.vx=0;if(!hitsBuilding(player.x,ny)&&!hitsTrafficVehicle(player.x,ny))player.y=ny;else player.vy=0;player.moving=Math.min(1,Math.hypot(player.vx,player.vy)/max);player.step+=dt*(player.running?17:11)*player.moving;if(n){elapsed+=dt;document.querySelector('#day').textContent=elapsed>12?'Užíváš si pohodovou procházku.':'Rozhlédni se po náměstí.'}let mins=20+Math.floor(t/5000)%40;document.querySelector('#clock').textContent='14:'+String(mins).padStart(2,'0');requestAnimationFrame(loop)}requestAnimationFrame(draw);requestAnimationFrame(loop);
